[package]
name = "rocket-app"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
diesel = { version = "2.3.14", features = ["sqlite", "r2d2"] }
rocket = { version = "0.5.2", features = ["json"]}
rocket_sync_db_pools = { version = "0.1.0", features = ["diesel_sqlite_pool"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
